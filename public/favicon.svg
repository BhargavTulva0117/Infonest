<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <radialGradient id="sphereGrad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#4C1D95" />
    </radialGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cosmic Circle Base -->
  <circle cx="64" cy="64" r="60" fill="#090B14" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Outer Orbital Ring -->
  <ellipse cx="64" cy="64" rx="52" ry="24" transform="rotate(-26 64 64)" stroke="url(#orbitGrad)" stroke-width="1.8" stroke-dasharray="140 10" opacity="0.85" filter="url(#glow)" />

  <!-- Inner Orbital Ring -->
  <ellipse cx="64" cy="64" rx="46" ry="18" transform="rotate(32 64 64)" stroke="#A855F7" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Knowledge Nest / Open Book Petals -->
  <path d="M 28 78 C 36 94, 52 102, 64 102 C 76 102, 92 94, 100 78 C 88 88, 76 90, 64 88 C 52 90, 40 88, 28 78 Z" fill="url(#bookGrad)" opacity="0.9" />
  <path d="M 36 72 C 44 82, 54 86, 64 85 C 74 86, 84 82, 92 72 C 84 78, 74 80, 64 79 C 54 80, 44 78, 36 72 Z" fill="#6366F1" opacity="0.95" />
  <path d="M 44 64 C 50 72, 57 74, 64 74 C 71 74, 78 72, 84 64 C 77 69, 70 70, 64 70 C 58 70, 51 69, 44 64 Z" fill="#38BDF8" />

  <!-- Central Glowing Knowledge Sphere -->
  <circle cx="64" cy="54" r="16" fill="url(#sphereGrad)" filter="url(#glow)" />
  <circle cx="60" cy="50" r="4" fill="#FFFFFF" opacity="0.6" />

  <!-- Top 4-Point Star Sparkle -->
  <path d="M 64 26 Q 64 34 58 34 Q 64 34 64 42 Q 64 34 70 34 Q 64 34 64 26 Z" fill="#FDE047" filter="url(#glow)" />

  <!-- Orbiting Knowledge Planets/Nodes -->
  <!-- Cyan Node on Left -->
  <circle cx="20" cy="52" r="4.5" fill="#38BDF8" filter="url(#glow)" />
  <!-- Purple/Magenta Node on Top Right -->
  <circle cx="102" cy="40" r="5" fill="#C084FC" filter="url(#glow)" />
  <!-- Gold Node on Bottom Right -->
  <circle cx="108" cy="74" r="3.5" fill="#FBBF24" filter="url(#glow)" />
</svg>
